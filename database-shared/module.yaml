apply: [ //kmp.module-template.yaml, //publishing.module-template.yaml ]

product:
  type: kmp/lib
  platforms: [ jvm, android, js, iosX64, iosArm64, iosSimulatorArm64, macosArm64 ]

settings:
  kotlin:
    serialization: enabled

# Derived from this module's own Gradle source-set graph: androidMain/jvmMain hang off
# jvmCommonMain, everything else off nonJvmMain. Other modules in this repo spell the same
# idea with different platform sets, so these cannot be shared.
aliases:
  - jvmCommon: [ jvm, android ]
  - nonJvm: [ js, iosX64, iosArm64, iosSimulatorArm64, macosArm64 ]

# Runs database-processor over src/ and feeds the result into the common fragment.
# See ksp-common/plugin.yaml for why the built-in KSP integration cannot be used.
plugins:
  ksp-common:
    enabled: true
    localDependencies:
      dependencies:
        - //data-shared
        - //currency
    testLocalDependencies:
      dependencies:
        - //data-shared
        - //currency
        - //test

dependencies:
  - //data-shared: exported
  - //currency: exported
  - org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0

test-dependencies:
  - //test
  - org.jetbrains.kotlin:kotlin-test:2.4.10
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

# Gradle names the Kotlin module "<group>:<artifact>", which determines the
# META-INF/*.kotlin_module entry on JVM and Android and the module name baked into JS and Klib
# output. The Toolchain defaults to the module directory name, so it is restated per platform
# here. This value is per-module and cannot be shared through a template.
settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.services:database-shared" ]

settings@android:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.services:database-shared" ]

settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=com.lightningkite.services:database-shared ]

settings@apple:
  kotlin:
    freeCompilerArgs: [ -module-name, "com.lightningkite.services:database-shared", -Xexport-kdoc ]

# settings@<platform> applies to test compilations too, so the module name above would other-
# wise be given to the test output as well. On Apple targets that is fatal: main and test klibs
# end up with the same `unique_name` and the KLIB resolver refuses to load both. These restore
# the Toolchain's default test module name; test output is never published.
test-settings@jvm:
  kotlin:
    freeCompilerArgs: [ -module-name, database-shared_test ]

test-settings@android:
  kotlin:
    freeCompilerArgs: [ -module-name, database-shared_test ]

test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=database-shared_test ]

test-settings@apple:
  kotlin:
    freeCompilerArgs: [ -module-name, database-shared_test ]

# The Toolchain does not add kotlin-dom-api-compat the way the Kotlin Gradle plugin does, so
# without this every org.w3c.dom type is unresolvable on JS. Declared per module rather than in
# the shared template: a `dependencies@js` block in a template was observed reaching the
# iosArm64 and macosArm64 resolutions too, which this modifier is meant to exclude.
dependencies@js:
  - org.jetbrains.kotlin:kotlin-dom-api-compat:2.4.10
